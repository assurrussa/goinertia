# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

concurrency:
  group: go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master", "release/*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Set up Node for pinned client replay
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Build
        run: go build -v ./...

      - name: Test Race
        run: go test -race -v ./...

      - name: Protocol replay and public HTTP consumer
        run: make protocol-replay http-consumer

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        inertia: ['2.3.18', '2.3.28']
        framework: ['vue', 'react']
    env:
      INERTIA_VERSION: ${{ matrix.inertia }}
      FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integration/browser/package-lock.json
      - run: npm ci
        working-directory: integration/browser
      - run: npx playwright install --with-deps chromium
        working-directory: integration/browser
      - run: npm run build && npm test
        working-directory: integration/browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.framework }}-${{ matrix.inertia }}
          path: |
            integration/browser/playwright-report
            integration/browser/test-results
          retention-days: 7
